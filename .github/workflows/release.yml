name: Release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: Release tag to rebuild and update (for example, v0.1.0)
        required: false
        default: v0.1.0
        type: string

permissions:
  contents: write

env:
  RELEASE_VERSION: ${{ github.event_name == 'workflow_dispatch' && inputs.version || github.event.release.tag_name }}

jobs:
  build:
    name: Build (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux-x86_64
          - os: windows-latest
            platform: windows-x86_64
          - os: macos-latest
            platform: macos

    steps:
      - name: Check out release source
        uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_VERSION }}

      - name: Configure
        shell: bash
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX="$PWD/stage"

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Install library and CLI
        run: cmake --install build --config Release

      - name: Package release archive
        shell: bash
        env:
          ARCHIVE: lunar-phases-${{ matrix.platform }}-${{ env.RELEASE_VERSION }}.tar.gz
        run: |
          cmake -E chdir stage cmake -E tar czf "../$ARCHIVE" --format=gnutar .

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: lunar-phases-${{ matrix.platform }}
          path: lunar-phases-${{ matrix.platform }}-${{ env.RELEASE_VERSION }}.tar.gz
          if-no-files-found: error

  publish:
    name: Publish release assets
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download packaged artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: lunar-phases-*
          path: dist
          merge-multiple: true

      - name: Upload assets to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release upload "${{ env.RELEASE_VERSION }}" dist/* --clobber
